<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193a31"><title>Seu pedido · Mesa3D</title><link rel="stylesheet" href="/styles.css"></head>
<body class="access-page"><main class="order-confirmation"><a href="/" class="studio-brand"><span class="brand-mark">M<span>³</span></span><span><strong>Mesa3D</strong><small>SEU PEDIDO</small></span></a><div class="order-confirmation-card"><span class="eyebrow">PEDIDO REGISTRADO</span><h1 id="orderHeading">Verificando pedido...</h1><p id="orderRestaurant"></p><div class="measure-panel"><div><small>NÚMERO</small><strong id="orderNumber">—</strong></div><div><small>TOTAL</small><strong id="orderTotal">—</strong></div></div><p id="orderStatus" role="status"></p><button class="button terracotta" id="retryPayment" hidden>Pagar online ↗</button><a class="button outline" id="orderBack" href="/">Voltar ao cardápio ↗</a><small>O status de pagamento é confirmado pelo servidor. Se você acabou de pagar, a atualização pode levar alguns instantes.</small></div></main>
<script type="module">import{api,money}from'/common.js';const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');async function refresh(){try{const o=await api('/api/orders/'+encodeURIComponent(id||''));$('orderHeading').textContent=o.paymentStatus==='paid'?'Pagamento confirmado.':o.status==='awaiting_payment'?'Finalize o pagamento.':'Seu pedido chegou.';$('orderRestaurant').textContent=o.restaurant;$('orderNumber').textContent=o.id.slice(0,8).toUpperCase();$('orderTotal').textContent=money(o.totalCents/100);$('orderStatus').textContent=o.paymentStatus==='paid'?'Pago online · pedido recebido.':o.status==='cancelled'?'Pedido cancelado.':o.status==='awaiting_payment'?'O pedido será enviado à cozinha após confirmação do pagamento.':'Pedido recebido. Pague na mesa.';$('retryPayment').hidden=!o.paymentAvailable||o.paymentStatus==='paid';$('orderBack').href='/?loja='+encodeURIComponent(o.slug)}catch(e){$('orderHeading').textContent='Pedido não encontrado.';$('orderStatus').textContent=e.message}}$('retryPayment').addEventListener('click',async()=>{try{const result=await api('/api/orders/'+encodeURIComponent(id)+'/checkout',{method:'POST',body:'{}'});location.href=result.url}catch(e){$('orderStatus').textContent=e.message}});refresh();setInterval(refresh,12000)</script></body></html>
