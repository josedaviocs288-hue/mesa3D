services:
  mesa3d:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      MESA3D_DATA_DIR: /data
    volumes:
      - ./runtime-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mesa3d:
        condition: service_healthy
    environment:
      MESA3D_DOMAIN: ${MESA3D_DOMAIN:?Defina MESA3D_DOMAIN em .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.container:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
